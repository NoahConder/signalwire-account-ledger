name: Tests

# The tests never contact SignalWire and need no credentials.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly, to catch a dependency release that breaks the example

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest
